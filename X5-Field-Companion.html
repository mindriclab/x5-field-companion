<meta name="description" content="Insta360 X5 Guide & Setup-Planner — offline, zweisprachig. Built by mindric lab.">

<link rel="preconnect" href="https://api.fontshare.com">

<style>
/* ============================================================
   X5 Field Companion — single-file app
   Design system: Field / Outdoor aesthetic (see 04_DESIGN_BRAND.md)
   ============================================================ */
:root {
  /* Dark theme (default) */
  --bg:        #14201c;
  --surface:   #1c2620;
  --surface-2: #232f28;
  --accent:    #d97757;  /* terracotta / trail-marker */
  --accent-2:  #8fae8b;  /* sage */
  --text:      #ece6da;
  --text-dim:  #8a9389;
  --border:    rgba(255,255,255,0.08);
  --accent-soft: rgba(217,119,87,0.14);
  --sage-soft:   rgba(143,174,139,0.14);
  --warn:      #e0b15a;
  --warn-soft: rgba(224,177,90,0.14);
  --shadow:    0 8px 30px rgba(0,0,0,0.35);

  --font-head: "Space Grotesk", "Archivo", system-ui, sans-serif;
  --font-body: "Satoshi", "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;

  --radius: 14px;
  --radius-sm: 9px;
  --sidebar-w: 264px;
  --maxw: 1100px;
}
:root[data-theme="light"] {
  --bg:        #f3efe6;
  --surface:   #ffffff;
  --surface-2: #ece6da;
  --accent:    #c25f3f;
  --accent-2:  #5f7d5b;
  --text:      #23302a;
  --text-dim:  #6a7468;
  --border:    rgba(0,0,0,0.10);
  --accent-soft: rgba(194,95,63,0.12);
  --sage-soft:   rgba(95,125,91,0.12);
  --warn:      #a9772a;
  --warn-soft: rgba(169,119,42,0.14);
  --shadow:    0 8px 30px rgba(0,0,0,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1,h2,h3,h4 { font-family: var(--font-head); font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--font-mono); }

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  z-index: 50;
}
.brand {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.brand .logo {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 9px;
}
.brand .logo .mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #b85c3e);
  display: grid; place-items: center;
  color: #fff; font-size: 14px; flex-shrink: 0;
}
.brand .tag { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

.nav { padding: 12px 12px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--text-dim); cursor: pointer;
  font-weight: 500; font-size: 14.5px;
  border: 1px solid transparent;
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft); color: var(--text);
  border-color: rgba(217,119,87,0.30);
}
.nav-item .ico { width: 18px; text-align: center; opacity: .9; }

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.toggle-row { display: flex; gap: 8px; }
.seg {
  flex: 1; display: flex;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 3px; gap: 3px;
}
.seg button {
  flex: 1; border: none; background: transparent;
  color: var(--text-dim); cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: 12.5px;
  padding: 6px 0; border-radius: 6px;
  transition: background .15s, color .15s;
}
.seg button.on { background: var(--accent); color: #fff; }
.seg-label { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .06em; }
.credit { font-size: 12px; color: var(--text-dim); }
.credit a { font-weight: 600; }

/* ---------- Main ---------- */
.main { margin-left: var(--sidebar-w); min-width: 0; }
.content { max-width: var(--maxw); margin: 0 auto; padding: 40px 40px 80px; }
.page { display: none; }
.page.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { margin-bottom: 26px; }
.page-head h1 { font-size: 30px; }
.page-head p { color: var(--text-dim); margin-top: 8px; max-width: 60ch; }
.eyebrow {
  color: var(--accent); font-weight: 600; font-size: 12.5px;
  text-transform: uppercase; letter-spacing: .09em; margin-bottom: 8px;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.card h2 { font-size: 20px; margin-bottom: 4px; }
.card h3 { font-size: 16px; margin: 18px 0 8px; }
.card .sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 14px; }
.card p { margin-bottom: 10px; }
.card ul, .card ol { margin: 8px 0 12px 20px; }
.card li { margin-bottom: 6px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 18px; }

/* ---------- Tables ---------- */
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0 4px; }
table.tbl th, table.tbl td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.tbl th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.tbl tr:last-child td { border-bottom: none; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }

/* ---------- Info / tip / warn boxes ---------- */
.box { border-radius: var(--radius-sm); padding: 13px 15px; margin: 12px 0; font-size: 14px; border: 1px solid var(--border); }
.box.tip  { background: var(--sage-soft);   border-color: rgba(143,174,139,.3); }
.box.warn { background: var(--warn-soft);   border-color: rgba(224,177,90,.35); }
.box.info { background: var(--accent-soft); border-color: rgba(217,119,87,.28); }
.box .lbl { font-weight: 700; font-family: var(--font-head); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; display:block; margin-bottom: 4px; }
.box.tip .lbl  { color: var(--accent-2); }
.box.warn .lbl { color: var(--warn); }
.box.info .lbl { color: var(--accent); }

/* ---------- Scene grid ---------- */
.scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
.scene-tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px 14px; cursor: pointer;
  transition: border-color .15s, transform .1s; text-align: left;
}
.scene-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.scene-tile .emoji { font-size: 22px; }
.scene-tile .name { font-family: var(--font-head); font-weight: 600; margin-top: 8px; font-size: 14.5px; }

/* ---------- Planner ---------- */
.stepper { display: flex; flex-wrap: wrap; gap: 18px; }
.qblock { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; flex: 1 1 240px; }
.qblock.disabled { opacity: .45; pointer-events: none; }
.qblock .qtitle { font-family: var(--font-head); font-weight: 600; font-size: 14px; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
.qblock .qnum { background: var(--accent-soft); color: var(--accent); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 7px; }
.opt {
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: var(--radius-sm); padding: 9px 12px; cursor: pointer;
  font-size: 13.5px; color: var(--text); text-align: left;
  font-family: var(--font-body); transition: border-color .12s, background .12s;
}
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.opt .lock { float: right; color: var(--text-dim); font-size: 11px; }

.planner-actions { display: flex; gap: 12px; margin: 22px 0 8px; align-items: center; flex-wrap: wrap; }
.btn {
  font-family: var(--font-head); font-weight: 600; font-size: 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 11px 20px; cursor: pointer; background: var(--surface-2); color: var(--text);
  transition: filter .12s, background .12s;
}
.btn:hover { filter: brightness(1.08); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- Result card ---------- */
.result { margin-top: 8px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin: 8px 0 16px; }
.setting {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px;
}
.setting .k { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
.setting .v { font-family: var(--font-mono); font-size: 14.5px; margin-top: 4px; font-weight: 500; }
.setting .v.accent { color: var(--accent); }
.badge { display:inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.badge.on  { background: var(--sage-soft); color: var(--accent-2); }
.badge.off { background: var(--surface-2); color: var(--text-dim); }

/* ---------- Checklist ---------- */
.checklist { list-style: none; margin: 4px 0; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--border); }
.checklist li:last-child { border-bottom: none; }
.checklist input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.checklist label { cursor: pointer; }
.checklist .done label { text-decoration: line-through; color: var(--text-dim); }

/* ---------- Mobile bottom nav ---------- */
.mobile-nav { display: none; }
.mobile-bar { display: none; }

@media (max-width: 820px) {
  body { padding-bottom: 64px; }
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .content { padding: 22px 18px 60px; }
  .page-head h1 { font-size: 24px; }
  .mobile-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 30;
  }
  .mobile-bar .logo { font-family: var(--font-head); font-weight: 700; font-size: 16px; display:flex; gap:8px; align-items:center; }
  .mobile-bar .logo .mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,var(--accent),#b85c3e); color:#fff; display:grid; place-items:center; font-size:12px; }
  .mobile-bar .controls { display: flex; gap: 8px; }
  .mobile-bar .seg { width: auto; }
  .mobile-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .mobile-nav .nav-item {
    flex: 1; flex-direction: column; gap: 3px; font-size: 10.5px;
    padding: 8px 2px; border-radius: 0; justify-content: center;
  }
  .mobile-nav .nav-item.active { background: var(--accent-soft); }
  .mobile-nav .nav-item .ico { width: auto; font-size: 17px; }
  .stepper { flex-direction: column; }
}
.footer-note { color: var(--text-dim); font-size: 12.5px; margin-top: 30px; text-align: center; }

/* ---------- Chapter chip nav (guide) ---------- */
.chapter-nav {
  display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 22px;
  position: sticky; top: 0; z-index: 10;
  background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: thin;
}
.chapter-nav::-webkit-scrollbar { height: 6px; }
.chapter-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
.chip {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); border-radius: 99px; padding: 6px 13px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
  font-family: var(--font-body); transition: border-color .12s, color .12s, background .12s;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.active { background: var(--accent); color: #fff; border-color: transparent; }
.card[id^="sec-"] { scroll-margin-top: 78px; }
.scene-back { margin-bottom: 14px; }
.scene-detail-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.scene-detail-head .emoji { font-size: 30px; }
.scene-detail-head h3 { font-size: 19px; margin: 0; }
.scene-detail-head .sub { color: var(--text-dim); font-size: 13px; margin: 2px 0 0; }
@media (max-width: 820px) { .chapter-nav { position: static; } }
</style>
</head>

    auflösung: base.auflösung,
    fps: base.fps,

  };
  if (LAYER2[vorhaben]) LAYER2[vorhaben](r, { vorhaben, tageszeit, umgebung, montage });
  if (LAYER3[montage]) LAYER3[montage](r, { vorhaben, tageszeit, umgebung, montage });

  if (vorhaben === "astro" && montage !== "tripod")
    r.warnhinweise.push({ de: "Stativ ist hier praktisch zwingend, sonst werden Aufnahmen unbrauchbar.", en: "A tripod is practically mandatory here — otherwise the shots become unusable." });
  if (montage === "selfiestick" && !isMode360(r.aufnahmemodus))
    r.warnhinweise.push({ de: "Diese Montage funktioniert nur im 360°-Modus — der empfohlene Modus weicht ab.", en: "This mount only works in 360° mode — the recommended mode differs." });

  /* dedupe tips (by de text), cap at 5 */
  const seen = {}; r.tipps = r.tipps.filter(t => { const k = t.de || t; return seen[k] ? false : (seen[k] = true); }).slice(0, 5);
  return r;
}

      { de: "360° zeigt alles — Kabel, Stativ, dich selbst. Aufräumen lohnt sich.", en: "360° shows everything — cables, tripod, yourself. Tidying up pays off." },
    ],
    info: null,
  },
  {
    id: "bewegung", emoji: "🏃", thumb: "linear-gradient(135deg,#4CAF50,#8BC34A)",
    name: { de: "Action / Bewegung", en: "Action / Movement" },
    hint: { de: "Hohe Framerate, kurze Belichtung", en: "High frame rate, short exposure" },
    settings: [
      [{ de: "Modus", en: "Mode" }, { de: "Einzelobjektiv (gutes Licht) oder 360°", en: "Single-Lens (good light) or 360°" }],
      [{ de: "Auflösung", en: "Resolution" }, { de: "8K oder 5.7K bei 60fps", en: "8K or 5.7K at 60fps" }],
      ["FPS", { de: "60 fps für Slow-Mo in Post", en: "60 fps for slow-mo in post" }],
      ["ISO", { de: "Auto, bleibt meist niedrig", en: "Auto, usually stays low" }],
      [{ de: "Verschlusszeit", en: "Shutter" }, "1/250 – 1/1000s"],
      ["FlowState", { de: "An — wichtigste Einstellung bei Action", en: "On — the key setting for action" }],
      ["DeepTrack", { de: "In Studio: Motiv verfolgen", en: "In Studio: track the subject" }],
    ],
    tips: [
      { de: "60fps aufnehmen → in DaVinci auf 50% verlangsamen = flüssiges Slow-Mo.", en: "Record 60fps → slow to 50% in DaVinci = smooth slow-mo." },
      { de: "FlowState ist bei der X5 sehr gut — auch beim Laufen brauchbares Bild.", en: "FlowState on the X5 is very good — usable footage even while running." },
      { de: "DeepTrack in Studio spart massiv Zeit beim Keyframing.", en: "DeepTrack in Studio saves a lot of keyframing time." },
    ],
    info: null,
  },
];

/* ============================================================
   10. CHEATSHEET — scenario matrix (Layer 1) + grouped reference
   ============================================================ */
const CHEATSHEET = {
  head: [
    { de: "Szenario", en: "Scenario" }, { de: "Modus", en: "Mode" }, { de: "Auflösung", en: "Resolution" },
    { de: "ISO", en: "ISO" }, { de: "Verschluss", en: "Shutter" }, { de: "WB", en: "WB" }, { de: "Anti-Flicker", en: "Anti-flicker" },
  ],
  rows: [
    { de: "Tageslicht · Outdoor", en: "Daylight · Outdoor" },
    { de: "Tageslicht · Indoor", en: "Daylight · Indoor" },
    { de: "Dämmerung · Outdoor", en: "Dusk · Outdoor" },
    { de: "Dämmerung · Indoor", en: "Dusk · Indoor" },
    { de: "Nacht · Outdoor", en: "Night · Outdoor" },
    { de: "Nacht · Indoor", en: "Night · Indoor" },
  ],
  keys: ["day|outdoor", "day|indoor", "dusk|outdoor", "dusk|indoor", "night|outdoor", "night|indoor"],
};

/* Grouped quick-reference (2-col), from the base guide */
const CHEATSHEET_REF = [
  { group: { de: "📹 Aufnahme", en: "📹 Capture" }, rows: [
    [{ de: "Auflösung", en: "Resolution" }, { de: "8K (7680×3840) immer bevorzugen", en: "Always prefer 8K (7680×3840)" }],
    ["Stitching", { de: "KI-Stitching + Chromatische Kalibrierung an", en: "AI stitching + chromatic calibration on" }],
    [{ de: "Framerate", en: "Frame rate" }, { de: "29.97 / 30 Standard · 60 für Slow-Mo", en: "29.97 / 30 standard · 60 for slow-mo" }],
    [{ de: "ISO (Auto)", en: "ISO (auto)" }, { de: "Für Dämmerlicht manuell auf max. 800–1600 begrenzen", en: "For dusk, manually cap at max. 800–1600" }],
  ] },
  { group: { de: "🎯 Projektion (Studio)", en: "🎯 Projection (Studio)" }, rows: [
    [{ de: "Flat-Video", en: "Flat video" }, "LINEAR + FOV 80–95°"],
    [{ de: "Fisheye-Look", en: "Fisheye look" }, { de: "FOV über 110° → runterziehen", en: "FOV above 110° → pull down" }],
    ["Tiny Planet", { de: "Per Keyframe animieren: LINEAR → Tiny Planet → LINEAR", en: "Animate via keyframes: LINEAR → Tiny Planet → LINEAR" }],
  ] },
  { group: { de: "📤 Export", en: "📤 Export" }, rows: [
    [{ de: "Flat für Social", en: "Flat for social" }, "Video · H.264 · 30 Mbps · 2720×1530"],
    [{ de: "Archiv", en: "Archive" }, "Video · H.265 · 50–100 Mbps · 3840×2160"],
    ["YouTube 360°", { de: "360°-Video · H.264 · 8K", en: "360° video · H.264 · 8K" }],
  ] },
];
</script>

<script>
/* ============================================================
   10. RENDER ENGINE
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (id) => document.getElementById(id);

/* ---- block renderer (guide content) ---- */
function tableHtml(t) {
  const head = "<tr>" + t.head.map(h => `<th>${tx(h)}</th>`).join("") + "</tr>";
  const body = t.rows.map(row => "<tr>" + row.map(c => `<td>${tx(c)}</td>`).join("") + "</tr>").join("");
  return `<div class="tbl-wrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function rb(b) {
  if (b.p)  return `<p>${tx(b.p)}</p>`;
  if (b.h)  return `<h3>${tx(b.h)}</h3>`;
  if (b.ul) return `<ul>${b.ul.map(li => `<li>${tx(li)}</li>`).join("")}</ul>`;
  if (b.ol) return `<ol>${b.ol.map(li => `<li>${tx(li)}</li>`).join("")}</ol>`;
  if (b.table) return tableHtml(b.table);
  if (b.box) return `<div class="box ${b.box.kind}"><span class="lbl">${tx(b.box.lbl)}</span>${tx(b.box.text)}</div>`;
  return "";
}

/* ---- toggles ---- */
function buildSeg(host, items, current, onPick) {
  host.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.textContent = it.label;
    if (it.id === current) b.classList.add("on");
    b.onclick = () => onPick(it.id);
    host.appendChild(b);
  });
}
function refreshToggles() {
  const langItems = [{ id: "de", label: "DE" }, { id: "en", label: "EN" }];
  const themeItems = [{ id: "dark", label: tx(S.dark) }, { id: "light", label: tx(S.light) }];
  ["s-lang", "m-lang"].forEach(id => buildSeg(el(id), langItems, state.lang, setLang));
  ["s-theme", "m-theme"].forEach(id => buildSeg(el(id), themeItems, state.theme, setTheme));
}
function setLang(l)  { state.lang = l; localStorage.setItem("x5_lang", l); document.documentElement.lang = l; renderAll(); }
function setTheme(t) { state.theme = t; localStorage.setItem("x5_theme", t); document.documentElement.setAttribute("data-theme", t); renderAll(); }

/* ---- nav ---- */
function buildNav() {
  [el("nav"), el("mnav")].forEach(host => {
    host.innerHTML = "";
    NAV.forEach(n => {
      const d = document.createElement("div");
      d.className = "nav-item" + (n.id === state.route ? " active" : "");
      d.innerHTML = `<span class="ico">${n.ico}</span><span>${tx(n.label)}</span>`;
      d.onclick = () => { state.route = n.id; renderAll(); window.scrollTo(0, 0); };
      host.appendChild(d);
    });
  });
}

/* ---- static i18n labels ---- */
function applyChrome() {
  $$("[data-i18n]").forEach(n => { const k = n.getAttribute("data-i18n"); if (S[k]) n.textContent = tx(S[k]); });
  document.documentElement.lang = state.lang;
  document.documentElement.setAttribute("data-theme", state.theme);
}

/* ============================================================
   11. PAGES
   ============================================================ */
function pageHead(eyebrow, title, sub) {
  return `<div class="page-head">${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ""}<h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>`;
}

function renderSceneSection(s) {
  let h = `<div class="card" id="sec-${s.id}"><h2>${s.icon} ${tx(s.title)}</h2>`;
  const open = state.sceneOpen && SCENES.find(x => x.id === state.sceneOpen);
  if (open) {
    h += `<button class="btn scene-back" data-scene-back="1">← ${tx({ de: "Zurück zu Szenerien", en: "Back to scenes" })}</button>`;
    h += `<div class="scene-detail-head"><span class="emoji">${open.emoji}</span><div><h3>${tx(open.name)}</h3><p class="sub">${tx(open.hint)}</p></div></div>`;
    h += `<div class="settings-grid">` +
      open.settings.map(([k, v]) => `<div class="setting"><div class="k">${tx(k)}</div><div class="v">${tx(v)}</div></div>`).join("") + `</div>`;
    if (open.info) h += `<div class="box info"><span class="lbl">${tx({ de: "Gut zu wissen", en: "Good to know" })}</span>${tx(open.info)}</div>`;
    h += `<h3>${tx({ de: "Tipps", en: "Tips" })}</h3><ul>` + open.tips.map(t => `<li>${tx(t)}</li>`).join("") + `</ul>`;
  } else {
    h += `<p class="sub">${tx(s.intro)}</p><div class="scene-grid">` +
      SCENES.map(sc => `<button class="scene-tile" data-scene="${sc.id}"><div class="emoji">${sc.emoji}</div><div class="name">${tx(sc.name)}</div></button>`).join("") +
      `</div>`;
  }
  return h + `</div>`;
}

function renderGuide() {
  const lead = { de: "Praxis-Guide für die Insta360 X5 — Einstellungen, Modi, Montage und Workflow.", en: "Practical guide for the Insta360 X5 — settings, modes, mounting and workflow." };
  let html = pageHead(tx({ de: "Guide", en: "Guide" }), "X5 Field Guide", tx(lead));
  /* chapter chip nav */
  html += `<div class="chapter-nav">` +
    SECTIONS.map(s => `<button class="chip" data-jump="sec-${s.id}">${s.icon} ${tx(s.title)}</button>`).join("") + `</div>`;
  SECTIONS.forEach(s => {
    if (s.special === "scenes") { html += renderSceneSection(s); return; }
    html += `<div class="card" id="sec-${s.id}"><h2>${s.icon} ${tx(s.title)}</h2>` +
            s.blocks.map(rb).join("") + `</div>`;
  });
  html += `<div class="footer-note">${tx({ de: "Inhalte gelten für Insta360 X5. Firmware-abhängige Details können abweichen.", en: "Content applies to the Insta360 X5. Firmware-dependent details may vary." })}</div>`;
  return html;
}

function renderCheatsheet() {
  const head = "<tr>" + CHEATSHEET.head.map(h => `<th>${tx(h)}</th>`).join("") + "</tr>";
  const body = CHEATSHEET.keys.map((k, i) => {
    const d = LAYER1[k];
    const cells = [CHEATSHEET.rows[i], d.aufnahmemodus, d.auflösung, d.iso_range, d.verschlusszeit, d.weißabgleich,
      d.anti_flicker ? { de: "An", en: "On" } : { de: "Aus", en: "Off" }];
    return "<tr>" + cells.map(c => `<td>${tx(c)}</td>`).join("") + "</tr>";
  }).join("");
  let html = pageHead(tx({ de: "Referenz", en: "Reference" }), "Cheatsheet",
    tx({ de: "Schnellübersicht der Basis-Settings nach Szenario.", en: "Quick overview of base settings by scenario." })) +
    `<div class="card"><h2>${tx({ de: "Settings nach Szenario", en: "Settings by scenario" })}</h2><div class="tbl-wrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;

  /* grouped quick reference */
  const refBody = CHEATSHEET_REF.map(g =>
    `<tr><td colspan="2" style="background:var(--surface-2);color:var(--accent);font-weight:700">${tx(g.group)}</td></tr>` +
    g.rows.map(r => `<tr><td style="font-weight:600;white-space:nowrap">${tx(r[0])}</td><td>${tx(r[1])}</td></tr>`).join("")
  ).join("");
  html += `<div class="card"><h2>${tx({ de: "Schnellreferenz", en: "Quick reference" })}</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tx({ de: "Funktion", en: "Function" })}</th><th>${tx({ de: "Einstellung / Wert", en: "Setting / value" })}</th></tr></thead><tbody>${refBody}</tbody></table></div></div>`;
  return html;
}

/* ---- Planner ---- */
function renderPlanner() {
  const P = state.planner;
  const astro = P.vorhaben === "astro";
  let html = pageHead(tx({ de: "Setup-Planner", en: "Setup Planner" }),
    tx({ de: "Was filmst du heute?", en: "What are you filming today?" }),
    tx({ de: "Vier Fragen → eine konkrete Setup-Empfehlung. Regelbasiert, kein Internet nötig.", en: "Four questions → one concrete setup recommendation. Rule-based, no internet needed." }));

  const qDefs = [
    { key: "vorhaben",  n: 1, t: { de: "Vorhaben", en: "Project" }, opts: PLANNER_OPTS.vorhaben, disabled: false },
    { key: "tageszeit", n: 2, t: { de: "Tageszeit", en: "Time of day" }, opts: PLANNER_OPTS.tageszeit, disabled: astro, lockNote: { de: "Nacht (fix)", en: "Night (fixed)" } },
    { key: "umgebung",  n: 3, t: { de: "Umgebung", en: "Environment" }, opts: PLANNER_OPTS.umgebung, disabled: astro, lockNote: { de: "Outdoor (fix)", en: "Outdoor (fixed)" } },
    { key: "montage",   n: 4, t: { de: "Montage / Bewegung", en: "Mount / Movement" }, opts: PLANNER_OPTS.montage, disabled: false },
  ];

  html += `<div class="stepper">`;
  qDefs.forEach(q => {
    const sel = astro && q.key === "tageszeit" ? "night" : astro && q.key === "umgebung" ? "outdoor" : P[q.key];
    html += `<div class="qblock${q.disabled ? " disabled" : ""}"><div class="qtitle"><span class="qnum">${q.n}</span>${tx(q.t)}${q.disabled ? ` <span style="color:var(--text-dim);font-weight:400;font-size:12px">· ${tx(q.lockNote)}</span>` : ""}</div><div class="opts">`;
    q.opts.forEach(o => {
      html += `<button class="opt${sel === o.id ? " sel" : ""}" data-q="${q.key}" data-v="${o.id}">${tx(o.label)}</button>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  html += `<div class="planner-actions"><button class="btn" id="planner-reset">${tx({ de: "Zurücksetzen", en: "Reset" })}</button></div>`;

  const complete = P.vorhaben && P.montage && (astro || (P.tageszeit && P.umgebung));
  if (complete) {
    html += renderResult(planSetup(P), P.vorhaben);
  } else {
    html += `<div class="card"><p style="color:var(--text-dim);margin:0">${tx({ de: "Wähle oben deine Optionen — die Empfehlung erscheint automatisch.", en: "Pick your options above — the recommendation appears automatically." })}</p></div>`;
  }
  return html;
}

function setting(k, v, accent) {
  return `<div class="setting"><div class="k">${tx(k)}</div><div class="v${accent ? " accent" : ""}">${tx(v)}</div></div>`;
}

function renderResult(r, vorhaben) {
  let h = `<div class="result"><div class="card"><div class="eyebrow">${tx({ de: "Empfehlung", en: "Recommendation" })}</div><h2>${tx({ de: "Dein Setup", en: "Your Setup" })}</h2>`;

  h += `<div class="settings-grid">`;
  h += setting({ de: "Aufnahmemodus", en: "Capture mode" }, r.aufnahmemodus, true);
  h += setting({ de: "Auflösung", en: "Resolution" }, r.auflösung);
  h += setting({ de: "FPS", en: "FPS" }, r.fps);
  h += setting({ de: "ISO", en: "ISO" }, r.iso_range);
  h += setting({ de: "Verschlusszeit", en: "Shutter" }, r.verschlusszeit);
  h += setting({ de: "Weißabgleich", en: "White balance" }, r.weißabgleich);
  if (r.fov_empfehlung) h += setting({ de: "FOV", en: "FOV" }, r.fov_empfehlung);
  h += `<div class="setting"><div class="k">${tx({ de: "Anti-Flicker", en: "Anti-flicker" })}</div><div class="v"><span class="badge ${r.anti_flicker ? "on" : "off"}">${r.anti_flicker ? tx({ de: "An", en: "On" }) : tx({ de: "Aus", en: "Off" })}</span></div></div>`;
  h += `</div>`;

  h += `<div class="grid2">`;
  h += `<div><h3>${tx({ de: "Stabilisierung", en: "Stabilisation" })}</h3><p style="margin:0">${tx(r.flowstate_hinweis)}<br><span style="color:var(--text-dim)">${tx(r.stativ_empfehlung)}</span></p></div>`;
  if (r.tipps.length) {
    h += `<div><h3>${tx({ de: "Tipps", en: "Tips" })}</h3><ul style="margin:0 0 0 18px">${r.tipps.map(t => `<li>${tx(t)}</li>`).join("")}</ul></div>`;
  }
  h += `</div>`;

  r.warnhinweise.forEach(w => { h += `<div class="box warn"><span class="lbl">${tx({ de: "Achtung", en: "Caution" })}</span>${tx(w)}</div>`; });
  h += `</div>`;

  /* Packlist (hangs off the planner result) */
  const items = PACKLIST._common.concat(PACKLIST[vorhaben] || []);
  h += `<div class="card"><h2>🎒 ${tx({ de: "Packliste", en: "Packing List" })}</h2><ul class="checklist">` +
    items.map((it, i) => {
      const ck = `pack_${vorhaben}_${i}`;
      const on = state.checks[ck];
      return `<li class="${on ? "done" : ""}"><input type="checkbox" id="${ck}" data-ck="${ck}" ${on ? "checked" : ""}><label for="${ck}">${tx(it)}</label></li>`;
    }).join("") + `</ul></div>`;

  return h;
}

/* ---- Post-shoot ---- */
function renderPostshoot() {
  const v = state.planner.vorhaben;
  const baseChecks = [
    { de: "Footage von SD-Karte sichern (Backup)", en: "Back up footage from the SD card" },
    { de: "Clips sichten: Stock-tauglich vs. freier Content trennen", en: "Review clips: separate stock-ready vs. free content" },
    { de: "Erkennbare Personen / Marken markieren (Release nötig?)", en: "Flag recognisable people / brands (release needed?)" },
    { de: "Stitching/Reframing in Insta360 Studio prüfen", en: "Check stitching/reframing in Insta360 Studio" },
    { de: "GPS-Metadaten vor Stock-Upload prüfen", en: "Check GPS metadata before stock upload" },
    { de: "SD-Karte nach Backup in der Kamera formatieren", en: "Format the SD card in the camera after backup" },
  ];
  let h = pageHead(tx({ de: "Nach dem Dreh", en: "After the Shoot" }),
    tx({ de: "Post-Shoot-Checkliste", en: "Post-Shoot Checklist" }),
    tx({ de: "Schritte direkt nach der Aufnahme — vom Backup bis zum Keywording.", en: "Steps right after recording — from backup to keywording." }));

  h += `<div class="card"><ul class="checklist">` +
    baseChecks.map((c, i) => {
      const ck = `post_${i}`;
      const on = state.checks[ck];
      return `<li class="${on ? "done" : ""}"><input type="checkbox" id="${ck}" data-ck="${ck}" ${on ? "checked" : ""}><label for="${ck}">${tx(c)}</label></li>`;
    }).join("") + `</ul></div>`;

  if (v && KEYWORDS[v]) {
    h += `<div class="card"><h3 style="margin-top:0">${tx({ de: "Keywording-Vorschlag", en: "Keywording suggestion" })}</h3>` +
      `<p class="sub">${tx({ de: "Basierend auf deiner Planner-Auswahl. Muster: Motiv + Aktivität + Tageszeit + Landschaft + Stimmung.", en: "Based on your planner selection. Pattern: subject + activity + time + landscape + mood." })}</p>` +
      `<div class="box info"><span class="lbl">${tx({ de: "Start-Keywords", en: "Starter keywords" })}</span><code>${KEYWORDS[v]}</code></div></div>`;
  } else {
    h += `<div class="box tip"><span class="lbl">${tx({ de: "Tipp", en: "Tip" })}</span>${tx({ de: "Wähle im Setup-Planner ein Vorhaben — dann erscheinen hier passende Keyword-Vorschläge.", en: "Pick a project in the Setup Planner — matching keyword suggestions will appear here." })}</div>`;
  }
  return h;
}

/* ============================================================
   12. WIRE-UP
   ============================================================ */
/* scroll spy: highlight the chapter chip of the section near the top */
let spyObserver = null;
function setupScrollSpy() {
  if (spyObserver) { spyObserver.disconnect(); spyObserver = null; }
  if (state.route !== "guide") return;
  const chips = {};
  $$(".chip").forEach(c => { chips[c.dataset.jump] = c; });
  const secs = $$('[id^="sec-"]');
  if (!secs.length) return;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      Object.keys(chips).forEach(k => chips[k].classList.remove("active"));
      const chip = chips[e.target.id];
      if (!chip) return;
      chip.classList.add("active");
      const nav = chip.parentElement;
      const navR = nav.getBoundingClientRect(), chipR = chip.getBoundingClientRect();
      nav.scrollLeft += (chipR.left - navR.left) - (nav.clientWidth - chip.clientWidth) / 2;
    });
  }, { rootMargin: "-78px 0px -72% 0px", threshold: 0 });
  secs.forEach(s => spyObserver.observe(s));
}

function renderPage() {
  const c = el("content");
  if (state.route === "guide")      c.innerHTML = renderGuide();
  else if (state.route === "planner")   c.innerHTML = renderPlanner();
  else if (state.route === "cheatsheet") c.innerHTML = renderCheatsheet();
  else if (state.route === "postshoot")  c.innerHTML = renderPostshoot();

  /* guide: chapter jump */
  $$("[data-jump]").forEach(c => c.onclick = () => {
    const t = el(c.dataset.jump);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  /* guide: scene drilldown */
  $$("[data-scene]").forEach(t => t.onclick = () => { state.sceneOpen = t.dataset.scene; renderPage(); window.scrollTo(0, 0); });
  const sb = $("[data-scene-back]");
  if (sb) sb.onclick = () => { state.sceneOpen = null; renderPage(); const sec = el("sec-scenes"); if (sec) sec.scrollIntoView({ block: "start" }); };

  /* planner option clicks */
  $$(".opt").forEach(b => b.onclick = () => {
    state.planner[b.dataset.q] = b.dataset.v;
    renderPage();
  });
  const reset = el("planner-reset");
  if (reset) reset.onclick = () => { state.planner = { vorhaben: null, tageszeit: null, umgebung: null, montage: null }; renderPage(); };

  /* checklist persistence */
  $$("[data-ck]").forEach(box => box.onchange = () => {
    state.checks[box.dataset.ck] = box.checked;
    localStorage.setItem("x5_checks", JSON.stringify(state.checks));
    box.closest("li").classList.toggle("done", box.checked);
  });

  setupScrollSpy();
}

function renderAll() {
  applyChrome();
  refreshToggles();
  buildNav();
  renderPage();
}

/* init */
document.documentElement.setAttribute("data-theme", state.theme);
document.documentElement.lang = state.lang;
renderAll();
</script>


</body>
</html>
